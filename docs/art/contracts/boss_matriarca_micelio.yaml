id: boss_matriarca_micelio
name: "Matriarca do Micélio"
category: boss
description: "Minichefe monumental do Ninho Silvestre. Entidade vegetal ancestral e imóvel com camadas de chapéus de cogumelo em coroa orgânica, mantos de micélio e raízes arqueadas. Protege um coração brilhante de Lúmen no centro do tronco."
facing: left

canvas:
  width: 64
  height: 64
  baseline_y: 60
  pivot: [32, 60]

