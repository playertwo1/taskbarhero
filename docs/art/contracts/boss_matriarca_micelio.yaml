    frames: 4
    fps: 6
    duration_ms: 160
    loop: true
  attack:
    frames: 4
    fps: 10
    duration_ms: 100
    loop: false
  hit:
    frames: 2
    fps: 12
    duration_ms: 80
    loop: false
  death:
    frames: 6
    fps: 8
    duration_ms: 120
    loop: false

output:
  source_file: "assets/sprites/bosses/matriarca_micelio/boss_matriarca_micelio_golden.aseprite"
  sheet_file: "assets/sprites/bosses/matriarca_micelio/boss_matriarca_micelio_sheet.png"
  json_file: "assets/sprites/bosses/matriarca_micelio/boss_matriarca_micelio_sheet.json"
  format: "horizontal_strip"
  sheet_dimensions: [1024, 64]
