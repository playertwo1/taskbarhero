id: hero_flecha
name: "Flecha"
category: hero
description: "Arqueiro ágil e caçador do Bosque de Lúmen. Veste túnica e capuz de couro silvestre, empunha arco longo de madeira nobre e carrega aljava nas costas. Atacante primário de longo alcance."
facing: right

canvas:
  width: 48
  height: 48
  baseline_y: 44
  pivot: [24, 44]

palette:
  rampas:
    - silvestre   # Couro, túnica e capuz (#0d2615, #184725, #2b7a3e, #52b769, #98e2a3)
    - madeira     # Arco longo e astes (#2e1f14, #543820, #8a5e35, #bf8c56, #e3ba88)
    - ferro       # Pontas de flechas e fivelas (#131921, #3a4e63, #a8c5e6)
  max_colors: 14

animations:
  idle:
    frames: 4
    fps: 6
    duration_ms: 160
    loop: true
    description: "Postura leve de prontidão com arco na mão direita, capuz e ponta da capa com micro-oscilação."
  attack:
    frames: 4
    fps: 10
    duration_ms: 100
    loop: false
    description: "Encaixa a flecha na corda, puxa com tensão máxima, dispara com recuo do braço e relaxa."
  hit:
    frames: 2
    fps: 12
    duration_ms: 80
    loop: false
    description: "Impacto seco para trás com recuo do capuz e arco."
  death:
    frames: 6
    fps: 8
    duration_ms: 120
    loop: false
    description: "Colapso no chão com desprendimento do arco e dissolução em dither de sombras."

output:
  source_file: "assets/sprites/heroes/flecha/hero_flecha.aseprite"
  sheet_file: "assets/sprites/heroes/flecha/hero_flecha_sheet.png"
  json_file: "assets/sprites/heroes/flecha/hero_flecha_sheet.json"
  format: "horizontal_strip"
  sheet_dimensions: [768, 48]
