id: mob_lobo_alfa
name: "Lobo Alfa de Lúmen"
category: elite_enemy
description: "Predador ápice e elite do Bosque de Lúmen. Um lobo ancestral de porte imponente com pelagem escura salpicada de musgo e runas luminosas, olhos esmeralda pulsantes e juba de energia bioluminescente."
facing: left

canvas:
  width: 48
  height: 48
  baseline_y: 44
  pivot: [24, 44]

palette:
  rampas:
    - ardosia     # Pelagem sombria e garras (#0d1117, #161b22, #21262d, #30363d, #8b949e)
    - lumen       # Olhos, runas no flanco e juba espectral (#0d3320, #1a5c38, #2da44e, #56d364, #aff5b4)
    - presas      # Caninos e dentes (#d0d7de, #f6f8fa)
  max_colors: 12

animations:
  idle:
    frames: 4
    fps: 6
    duration_ms: 160
    loop: true
    description: "Respiração lenta e vigilante em postura predatória, juba espectral de lúmen ondulando suavemente."
  attack:
    frames: 4
    fps: 10
    duration_ms: 100
    loop: false
    description: "Agachamento rápido seguido de bote ágil com mandíbulas abertas e gotejamento de luz bioluminescente."
  hit:
    frames: 2
    fps: 12
    duration_ms: 80
    loop: false
    description: "Arqueamento da coluna para trás em recuo com esgarçamento de presas e contração muscular."
  death:
    frames: 6
    fps: 8
    duration_ms: 120
    loop: false
    description: "Colapso gracioso das patas ao solo, desvanecendo sua essência em chamas tênues de lúmen espectral."

output:
  source_file: "assets/sprites/enemies/lobo_alfa_de_lumen/mob_lobo_alfa.aseprite"
  sheet_file: "assets/sprites/enemies/lobo_alfa_de_lumen/mob_lobo_alfa_sheet.png"
  json_file: "assets/sprites/enemies/lobo_alfa_de_lumen/mob_lobo_alfa_sheet.json"
  format: "horizontal_strip"
  sheet_dimensions: [768, 48]
