id: mob_javali_musgo
name: "Javali de Musgo"
category: common_enemy
description: "Fera corpulenta e territorial do Bosque de Lúmen. Possui lombo couraçado por camadas densas de musgo e líquens, presas de marfim recurvadas para cima e patas troncudas com cascos pesados."
facing: left

canvas:
  width: 48
  height: 48
  baseline_y: 44
  pivot: [24, 44]

palette:
  rampas:
    - madeira     # Couro, cerdas e cascos (#2e1f14, #543820, #8a5e35, #bf8c56)
    - silvestre   # Musgo no lombo e folhagem (#0d2615, #184725, #2b7a3e, #52b769)
    - ferro       # Presas de marfim e realces (#adb5bd, #f1f3f5)
  max_colors: 12

animations:
  idle:
    frames: 4
    fps: 6
    duration_ms: 160
    loop: true
    description: "Respiração pesada e cadenciada, focinho bufando e leve oscilação da folhagem do lombo."
  attack:
    frames: 4
    fps: 10
    duration_ms: 100
    loop: false
    description: "Raspa o casco no chão, dispara uma investida com as presas para a esquerda e recua o peso."
  hit:
    frames: 2
    fps: 12
    duration_ms: 80
    loop: false
    description: "Recuo brusco de peso com cabeça jogada para cima em urro de dor."
  death:
    frames: 6
    fps: 8
    duration_ms: 120
    loop: false
    description: "Colapso lateral no solo, com o musgo do lombo se desprendendo em dither espectral."

output:
  source_file: "assets/sprites/enemies/javali_de_musgo/mob_javali_musgo.aseprite"
  sheet_file: "assets/sprites/enemies/javali_de_musgo/mob_javali_musgo_sheet.png"
  json_file: "assets/sprites/enemies/javali_de_musgo/mob_javali_musgo_sheet.json"
  format: "horizontal_strip"
  sheet_dimensions: [768, 48]
